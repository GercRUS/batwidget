plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.dima.batterywidget'
    compileSdk 34

    defaultConfig {
        applicationId "ru.dima.batterywidget"
        minSdk 26
        targetSdk 26
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
